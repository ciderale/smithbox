services:
  proxy:
    image: mitmproxy/mitmproxy
    networks: [int]
    command: |
      bash -c '
        set -x;
        export PYTHONUNBUFFERED=1
        rm -f /fakeRootCA/mitmproxy-ca.crt
        timeout 1 mitmdump --set confdir=/.mitmproxy || true;
        cp /.mitmproxy/mitmproxy-ca-cert.pem /fakeRootCA/mitmproxy-ca.crt;
        mitmweb --listen-host 0.0.0.0 --listen-port 3128 \
                --web-host 0.0.0.0 \
                --web-port 8081 \
                --set confdir=/.mitmproxy \
                --set web_password=password \
                -s /mitm.rules.py
      '
    volumes:
      - fakeRootCA:/fakeRootCA:rw
      - ./mitm.rules.py:/mitm.rules.py
    ports:
      - 3128:3128
      - 8081:8081
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',3128),2).close()"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 10s
      start_interval: 0.5s
