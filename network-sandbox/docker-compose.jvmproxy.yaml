services:
  sandbox:
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dhttp.proxyHost=proxy
        -Dhttp.proxyPort=3128
        -Dhttps.proxyHost=proxy
        -Dhttps.proxyPort=3128
        -Dhttp.nonProxyHosts="localhost|127.*|*.internal"
        -Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts

