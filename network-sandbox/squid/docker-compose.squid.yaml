services:
  proxy:
    build:
      dockerfile: Dockerfile.squid
    hostname: proxy
    user: squid
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ./.:/etc/squid/cfg
      - fakeRootCA:/fakeRootCA:rw
    networks:
      - int
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3128"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 10s
      start_interval: 0.5s
