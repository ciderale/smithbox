name: $PROJECT_NAME

services:
  sandbox:
    build:
      context: ${DOCKER_BUILD_CONTEXT}
      dockerfile: Dockerfile.docker-devshell.debian
      args:
        NIX_EXTRA_CONF: |
          tarball-ttl = 86400
          max-jobs = auto
          cores = 0
          http-connections = 49
    environment:
      MODE: plain
      UID: ${UID}
      GID: ${GID}
      HOME: ${HOME}
    volumes:
      - nixStore:/nix
      - homeVolume:${HOME}
    working_dir: ${HOME} # safe to override
volumes:
  homeVolume:
    name: ${SMITHBOX_VOLUME_PREFIX:-smithbox-global}-home
  nixStore:
    name: ${SMITHBOX_VOLUME_PREFIX:-smithbox-global}-nix-store
