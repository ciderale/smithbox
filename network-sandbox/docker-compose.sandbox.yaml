services:
  firewall:
    build:
      context: ${DOCKER_BUILD_CONTEXT}
      dockerfile: Dockerfile.dnsmasq
    networks: [int]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv4.conf.all.route_localnet: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "nslookup proxy 127.0.0.1 >/dev/null"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 10s
      start_interval: 0.5s

  proxy:
    build:
      context: ${DOCKER_BUILD_CONTEXT}
      dockerfile: Dockerfile.mitmproxy
    networks: [int]
    volumes:
      - proxy-ca:/proxy-ca:rw
    environment:
      RULE_FILES: "/mitm.rules.py"
      WEB_PASSWORD: password
    # ports: #don't auto expose for concurrent usage
      #- 3128:3128 #mitm proxy
      #- 8081:8081 #mitmweb interface
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',3128),2).close()"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 10s
      start_interval: 0.5s

  sandbox:
    network_mode: service:firewall
    environment:
      NAMESERVER: 127.0.0.1 #dnsmasq
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      JAVA_TOOL_OPTIONS: >-
        -Dhttp.proxyHost=proxy
        -Dhttp.proxyPort=3128
        -Dhttps.proxyHost=proxy
        -Dhttps.proxyPort=3128
        -Dhttp.nonProxyHosts="localhost|127.0.0.1"
        -Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts
    volumes:
      - type: volume
        source: proxy-ca
        target: /usr/local/share/ca-certificates
        volume:
          nocopy: true
    depends_on: # docker compose run automatically starts/stops dependent services
      firewall:
        condition: service_healthy
      proxy:
        condition: service_healthy
volumes:
  proxy-ca:

networks:
  int:
