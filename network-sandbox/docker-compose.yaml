services:
  dns-fw:
    build:
      dockerfile: Dockerfile.dnsmasq
    networks: [int]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    healthcheck:
      test: ["CMD-SHELL", "nslookup proxy 127.0.0.1 >/dev/null"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 10s
      start_interval: 0.5s

  proxy:
    build:
      dockerfile: Dockerfile.mitmproxy
    networks: [int]
    volumes:
      - fakeRootCA:/fakeRootCA:rw
    ports:
      - 3128:3128
      - 8081:8081
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',3128),2).close()"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 10s
      start_interval: 0.5s

  sandbox:
    build:
      dockerfile: Dockerfile.docker-devshell
    network_mode: service:dns-fw
    environment:
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro
      - nixStore:/nix
      - type: volume
        source: fakeRootCA
        target: /usr/local/share/ca-certificates
        volume:
          nocopy: true
      - $PWD/..:/project
    working_dir: /project
    depends_on: # docker compose run automatically starts/stops dependent services
      dns-fw:
        condition: service_healthy
      proxy:
        condition: service_healthy
volumes:
  fakeRootCA:

  nixStore:

networks:
  int:
