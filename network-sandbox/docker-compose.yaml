services:
  dns-fw:
    build:
      dockerfile: Dockerfile.dnsmasq
    hostname: dns-fw
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    command: >
      sh -c "
        set -eu
        echo network namespace hardening
        ip addr
        nft list ruleset
        nft -f /nftables.conf
        nft list ruleset

        echo generate tcp_allowed rules
        for host in $TCP_ALLOWED_HOSTS; do
          echo server=/$$host/127.0.0.11
        done >/etc/dnsmasq.tcp_allowed.conf

        exec dnsmasq -k --conf-file=/etc/dnsmasq.conf --conf-file=/etc/dnsmasq.tcp_allowed.conf
      "
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./nftables.conf:/nftables.conf:ro
    networks:
      - int
    healthcheck:
      test: ["CMD-SHELL", "nslookup proxy 127.0.0.1 >/dev/null"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 10s
      start_interval: 0.5s

  sandbox:
    build:
      context: ../docker-devshell
    network_mode: service:dns-fw
    environment:
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro
      - nixStore:/nix
      - type: volume
        source: fakeRootCA
        target: /usr/local/share/ca-certificates
        volume:
          nocopy: true
    depends_on: # docker compose run automatically starts/stops dependent services
      dns-fw:
        condition: service_healthy
      proxy:
        condition: service_healthy
volumes:
  fakeRootCA:

  nixStore:

networks:
  int:
